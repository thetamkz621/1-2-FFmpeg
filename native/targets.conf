# native/targets.conf — 目标（target）相关的映射表
#
# 每行一个目标，列顺序固定：
#
#   <target> | <ff_arch> | <ff_target_os> | <rust_target> | <ctng_triple> |
#   <ctng_config> | <meson_system> | <cmake_system> | <cmake_version> |
#   <win_tools> | <wine> | <prune>
#
#   ff_arch / ff_target_os  FFmpeg configure 的 --arch / --target-os
#   rust_target             cargo 的 --target
#   ctng_triple             crosstool-ng 产出的 GNU triple
#   ctng_config             toolchain/ctng/ 下的完整配置文件名
#   meson_system            cross.meson 的 host_machine.system
#   cmake_system             toolchain.cmake 的 CMAKE_SYSTEM_NAME
#   cmake_version            toolchain.cmake 的 CMAKE_SYSTEM_VERSION
#   win_tools               额外导出的工具（不带 triple 前缀，写 - 表示无）
#   wine                    1 表示 meson 需要 exe_wrapper = ['wine']
#   prune                   工具链裁剪方式：elf 删 .so 符号链接，mingw 删 dll
#
# 新增目标只改这张表；env.sh 据此生成 FFBUILD_TARGET_FLAGS、Rust 目标、
# meson/cmake 描述文件与工具链路径。targets 之外的假设（打包布局）仍由
# variants/<target>-*.sh 提供。

