# native/pkgdeps.conf — 构建依赖的"能力 → 发行版包名"映射
#
# 每行一个能力，列的顺序固定：
#
#   <capability> | <apt> | <dnf> | <dnf-el8> | <pacman> | <zypper>
#
#   apt      Debian / Ubuntu
#   dnf      Fedora、EL9+ 及任何 ID_LIKE 含 rhel/centos 但不是 8 的宿主
#   dnf-el8  RHEL 8 系（Rocky/Alma/CentOS Stream 8）：python 只有 3.6，nasm/ocaml
#            在 powertools 仓库；cargo-c 在系统 OpenSSL 过旧时使用 vendored OpenSSL
#   pacman   Arch
#   zypper   openSUSE Leap / SLES（Leap 16 实测）
#
# 一列写 `-` 表示该发行版没有对应包：可用性检查不会报错，安装时跳过。
# 一行可以写多个包（空格分隔），setup.sh 会去重后合并成一条安装命令。
#
# 改这里之前先在一个真实宿主上跑：
#   ./native/setup.sh --print-packages     # 看解析结果
#   ./native/setup.sh --check              # 看还缺什么
# 包名随发行版版本漂移（Fedora 44 就没有 wget 了），别按记忆填。

# --- 构建根 ---------------------------------------------------------------
toolchain        | build-essential                    | gcc gcc-c++ make patch        | gcc gcc-c++ make patch | base-devel  | gcc gcc-c++ make patch
zlib_dev         | zlib1g-dev                         | zlib-devel                    | zlib-devel             | zlib        | zlib-devel
openssl_dev      | libssl-dev                         | openssl-devel                 | openssl3-devel         | openssl     | libopenssl-devel
pkgconf          | pkg-config                         | pkgconf-pkg-config            | pkgconf-pkg-config     | pkgconf     | pkgconf

# --- 取源与解包 -----------------------------------------------------------
git              | git                                | git                           | git                    | git         | git
curl             | curl                               | curl                          | curl                   | curl        | curl
wget             | wget                               | -                             | wget                   | wget        | wget
ca_certificates  | ca-certificates                    | ca-certificates               | ca-certificates        | ca-certificates | ca-certificates
archivers        | tar xz-utils                       | tar xz                        | tar xz                 | tar xz      | tar xz
zip              | zip                                | zip                           | zip                    | zip         | zip
unzip            | unzip                              | unzip                         | unzip                  | unzip       | unzip

# --- configure 脚本依赖 ----------------------------------------------------
# libvpx 的 configure 用 which 查找 nasm/yasm；gettext 的 iconv 探测会打开
# EUC-JP，部分发行版把 gconv 模块拆成独立包，缺包时 configure 判定 iconv 不可
# 用，msgfmt 无法转换非 UTF-8 的 po 文件。
which            | debianutils                        | which                         | which                  | which       | which
iconv_modules    | -                                  | glibc-gconv-extra             | -                      | -           | glibc-gconv-modules-extra

