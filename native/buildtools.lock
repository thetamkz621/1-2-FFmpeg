#!/bin/bash
# shellcheck shell=bash
#
# native/buildtools.lock — 构建器版本表。
#
# 由 native/setup.sh 消费（决定装什么、从哪装、校验和），由 native/env.sh 消费
# （决定托管版本是否需要进入 PATH、以什么顺序进入）。
#
# 字段约定：
#   FFBUILD_BT_MIN_<tool>      图内所有依赖源码要求的最低“系统”版本
#   FFBUILD_BT_INSTALL_<tool>  不满足下限时装进 $FFBUILD_BUILDTOOLS_PREFIX 的版本
#   FFBUILD_BT_URL_<tool>      源码包地址
#   FFBUILD_BT_SHA256_<tool>   源码包校验和
#   FFBUILD_BT_SYSTEM_<tool>   只做版本检查、不构建（当前仅 python）
#
# 下限来源：2026-10-18 对 246 个缓存源的静态扫描（见 notes/PORTABILITY.md P11）。
# 全部写成 ${VAR:-默认}，便于临时覆盖做验证。

# --------------------------------------------------------------- autoconf -----
# 图内最高下限：libmp3lame 的 AC_PREREQ([2.73])
FFBUILD_BT_MIN_autoconf="${FFBUILD_BT_MIN_autoconf:-2.73}"
FFBUILD_BT_INSTALL_autoconf="${FFBUILD_BT_INSTALL_autoconf:-2.73}"
FFBUILD_BT_URL_autoconf="${FFBUILD_BT_URL_autoconf:-https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz}"
FFBUILD_BT_SHA256_autoconf="${FFBUILD_BT_SHA256_autoconf:-9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e}"

# --------------------------------------------------------------- automake -----
# 两条独立约束：
#   * 裸名 automake 的图内下限是 1.16.3（libxml2 的 AM_INIT_AUTOMAKE）
#   * libiconv 的 Makefile.devel 写死 automake-1.18 / aclocal-1.18，
#     这是“版本名”需求，与裸名下限无关，因此 1.18.x 必须始终可用
FFBUILD_BT_MIN_automake="${FFBUILD_BT_MIN_automake:-1.16.3}"
FFBUILD_BT_INSTALL_automake="${FFBUILD_BT_INSTALL_automake:-1.18.1}"
FFBUILD_BT_URL_automake="${FFBUILD_BT_URL_automake:-https://ftp.gnu.org/gnu/automake/automake-1.18.1.tar.xz}"
FFBUILD_BT_SHA256_automake="${FFBUILD_BT_SHA256_automake:-168aa363278351b89af56684448f525a5bce5079d0b6842bd910fdd3f1646887}"

# ------------------------------------------------------------------ cmake -----
# 图内最高下限：libaribcaption 的 cmake_minimum_required(VERSION 3.28)
FFBUILD_BT_MIN_cmake="${FFBUILD_BT_MIN_cmake:-3.28}"
FFBUILD_BT_INSTALL_cmake="${FFBUILD_BT_INSTALL_cmake:-3.28.3}"
FFBUILD_BT_URL_cmake="${FFBUILD_BT_URL_cmake:-https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3.tar.gz}"
FFBUILD_BT_SHA256_cmake="${FFBUILD_BT_SHA256_cmake:-72b7570e5c8593de6ac4ab433b73eab18c5fb328880460c86ce32608141ad5c1}"

# ----------------------------------------------------------------- python -----
# meson 1.12.1 的 Requires-Python 是 >=3.10；Python 不构建，只在版本不足时提示安装。
FFBUILD_BT_SYSTEM_python="${FFBUILD_BT_SYSTEM_python:-3.10}"
FFBUILD_BT_MESON="${FFBUILD_BT_MESON:-1.12.1}"
