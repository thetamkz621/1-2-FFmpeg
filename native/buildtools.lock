#!/bin/bash
# shellcheck shell=bash
#
# native/buildtools.lock — 构建器版本表。
#
# 由 native/setup.sh 消费（决定装什么、从哪装、校验和），由 native/env.sh 消费
# （决定托管版本是否需要进入 PATH、以什么顺序进入）。
#
# 字段约定：
#   FFBUILD_BT_MIN_<tool>      图内所有依赖源码要求的最低“系统”版本
#   FFBUILD_BT_INSTALL_<tool>  不满足下限时装进 $FFBUILD_BUILDTOOLS_PREFIX 的版本
#   FFBUILD_BT_URL_<tool>      源码包地址
#   FFBUILD_BT_SHA256_<tool>   源码包校验和
#   FFBUILD_BT_SYSTEM_<tool>   只做版本检查、不构建（当前仅 python）
#
# 下限来源：2026-10-18 对 246 个缓存源的静态扫描（见 notes/PORTABILITY.md P11）。
# 全部写成 ${VAR:-默认}，便于临时覆盖做验证。

# --------------------------------------------------------------- autoconf -----
# 图内最高下限：libmp3lame 的 AC_PREREQ([2.73])
FFBUILD_BT_MIN_autoconf="${FFBUILD_BT_MIN_autoconf:-2.73}"
FFBUILD_BT_INSTALL_autoconf="${FFBUILD_BT_INSTALL_autoconf:-2.73}"
FFBUILD_BT_URL_autoconf="${FFBUILD_BT_URL_autoconf:-https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz}"
FFBUILD_BT_SHA256_autoconf="${FFBUILD_BT_SHA256_autoconf:-9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e}"

# --------------------------------------------------------------- automake -----
# 两条独立约束：
#   * 裸名 automake 的图内下限是 1.16.3（libxml2 的 AM_INIT_AUTOMAKE）
#   * libiconv 的 Makefile.devel 写死 automake-1.18 / aclocal-1.18，
#     这是“版本名”需求，与裸名下限无关，因此 1.18.x 必须始终可用
FFBUILD_BT_MIN_automake="${FFBUILD_BT_MIN_automake:-1.16.3}"
FFBUILD_BT_INSTALL_automake="${FFBUILD_BT_INSTALL_automake:-1.18.1}"
FFBUILD_BT_URL_automake="${FFBUILD_BT_URL_automake:-https://ftp.gnu.org/gnu/automake/automake-1.18.1.tar.xz}"
FFBUILD_BT_SHA256_automake="${FFBUILD_BT_SHA256_automake:-168aa363278351b89af56684448f525a5bce5079d0b6842bd910fdd3f1646887}"

# ------------------------------------------------------------------ cmake -----
# 图内最高下限：libaribcaption 的 cmake_minimum_required(VERSION 3.28)
FFBUILD_BT_MIN_cmake="${FFBUILD_BT_MIN_cmake:-3.28}"
FFBUILD_BT_INSTALL_cmake="${FFBUILD_BT_INSTALL_cmake:-3.28.3}"
FFBUILD_BT_URL_cmake="${FFBUILD_BT_URL_cmake:-https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3.tar.gz}"
FFBUILD_BT_SHA256_cmake="${FFBUILD_BT_SHA256_cmake:-72b7570e5c8593de6ac4ab433b73eab18c5fb328880460c86ce32608141ad5c1}"

# ----------------------------------------------------------------- gettext -----
# zvbi's configure.ac declares AM_GNU_GETTEXT_VERSION([0.21]); autopoint refuses
# to run when the installed infrastructure is older (EL8 ships 0.19.8).
FFBUILD_BT_MIN_gettext="${FFBUILD_BT_MIN_gettext:-0.21}"
FFBUILD_BT_INSTALL_gettext="${FFBUILD_BT_INSTALL_gettext:-0.22.5}"
FFBUILD_BT_URL_gettext="${FFBUILD_BT_URL_gettext:-https://ftp.gnu.org/gnu/gettext/gettext-0.22.5.tar.xz}"
FFBUILD_BT_SHA256_gettext="${FFBUILD_BT_SHA256_gettext:-fe10c37353213d78a5b83d48af231e005c4da84db5ce88037d88355938259640}"

# ------------------------------------------------------------------- nasm -----
# FFmpeg refuses to build x86 asm below 2.13 ("nasm >= 2.13 required"); x264 also
# needs it. EL8 keeps nasm in CRB (powertools), not in base/EPEL, so a host that
# did not enable that repo simply has no assembler.
FFBUILD_BT_MIN_nasm="${FFBUILD_BT_MIN_nasm:-2.13}"
FFBUILD_BT_INSTALL_nasm="${FFBUILD_BT_INSTALL_nasm:-2.16.03}"
FFBUILD_BT_URL_nasm="${FFBUILD_BT_URL_nasm:-https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.xz}"
FFBUILD_BT_SHA256_nasm="${FFBUILD_BT_SHA256_nasm:-1412a1c760bbd05db026b6c0d1657affd6631cd0a63cddb6f73cc6d4aa616148}"

# ------------------------------------------------------------------- yasm -----
# FFmpeg accepts either assembler, but only linux64 + current FFmpeg were tested;
# older FFmpeg and the win* targets may still prefer yasm, so keep it available
# and managed rather than assuming nasm is enough.
FFBUILD_BT_MIN_yasm="${FFBUILD_BT_MIN_yasm:-1.3.0}"
FFBUILD_BT_INSTALL_yasm="${FFBUILD_BT_INSTALL_yasm:-1.3.0}"
FFBUILD_BT_URL_yasm="${FFBUILD_BT_URL_yasm:-http://www.tortall.net/projects/yasm/releases/yasm-1.3.0.tar.gz}"
FFBUILD_BT_SHA256_yasm="${FFBUILD_BT_SHA256_yasm:-3dce6601b495f5b3d45b59f7d2492a340ee7e84b5beca17e48f862502bd5603f}"

# ------------------------------------------------------------------- opam -----
# OCaml is *documented* as a prerequisite; opam is only the fallback for hosts
# where OCaml is missing or the findlib package "num" is unavailable (EL8 ships
# no num at all). opam itself is a static binary, so no compiler is needed to
# bootstrap it. The switch lives under $FFBUILD_BUILDTOOLS_PREFIX/opam.
FFBUILD_BT_INSTALL_opam="${FFBUILD_BT_INSTALL_opam:-2.6.1}"
FFBUILD_BT_URL_opam="${FFBUILD_BT_URL_opam:-https://github.com/ocaml/opam/releases/download/2.6.1/opam-2.6.1-x86_64-linux}"
FFBUILD_BT_SHA256_opam="${FFBUILD_BT_SHA256_opam:-b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d}"
# OCaml compiler used when the host has no usable system OCaml at all.
FFBUILD_BT_OCAML_COMPILER="${FFBUILD_BT_OCAML_COMPILER:-ocaml-base-compiler.4.14.3}"

# ----------------------------------------------------------------- python -----
# meson 1.12.1 的 Requires-Python 是 >=3.10；Python 不构建，只在版本不足时提示安装。
FFBUILD_BT_SYSTEM_python="${FFBUILD_BT_SYSTEM_python:-3.10}"
FFBUILD_BT_MESON="${FFBUILD_BT_MESON:-1.12.1}"
